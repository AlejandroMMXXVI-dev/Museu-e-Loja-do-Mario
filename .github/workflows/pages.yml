name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerar js/env.js a partir do secret
        run: |
          echo "RAWG_KEY=${{ secrets.RAWG_KEY }}" > .env
          node scripts/gerar-env.js
          node scripts/baixar-rawg.js || echo "Aviso: não foi possível baixar dados da RAWG"
          rm .env
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
