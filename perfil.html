
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <link rel="stylesheet" href="css/perfil.css">
</head>

<body>

    <div class="perfil-banner">

        <div class="foto-perfil">
            <img src="images/Prototipo_perfil.jpg" alt="Foto de perfil" width="150px" height="150px">
        </div>

        <div class="informacoes">
            <h2>Nome de Usuário</h2>
        
        </div>

        <div class="estatisticas">

            <div class="item">
                <p>Nível</p>
                <strong>1</strong>
            </div>

            <div class="item">
                <p>Compras</p>
                <strong>3</strong>
            </div>

        </div>

    </div>

<section class="produtos-comprados">

    <div class="titulo-produtos">
        <h2> Produtos Comprados</h2>
        <p>Confira os jogos que você adquiriu na nossa loja!</p>
    </div>

    <div class="lista-produtos">

        <!-- Produto 1 -->
        <div class="produto">
            <img src="images/mario_kart_8D.avif" alt="Mario Kart">
            <h3>Mario Kart 8 Deluxe</h3>
            <p>Data da compra: 10/11/2026</p>
            <button>Ver produto</button>
        </div>

        <!-- Produto 2 -->
        <div class="produto">
            <img src="images/super_mario_Odyssey.avif" alt="Super Mario Odyssey">
            <h3>Super Mario Odyssey</h3>
            <p>Data da compra: 05/11/2026</p>
            <button>Ver produto</button>
        </div>

        <!-- Produto 3 -->
        <div class="produto">
            <img src="images/super_mario_bros_wonder.avif" alt="Super Mario Bros Wonder">
            <h3>Super Mario Bros. Wonder</h3>
            <p>Data da compra: 02/11/2026</p>
            <button>Ver produto</button>
        </div>

    </div>

</section>

</body>
</html>
